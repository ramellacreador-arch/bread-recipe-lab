<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin | Bread Recipe Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="admin">
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Recipe administration</p>
          <h1>Admin</h1>
        </div>
        <div class="topbar-actions">
          <a class="ghost-button" href="index.html">Recipe</a>
          <button class="ghost-button" id="export-json" type="button" title="Export all saved recipes">Export</button>
          <button class="ghost-button" id="import-json" type="button" title="Import saved recipe data">Import</button>
          <input id="import-file" type="file" accept="application/json" hidden />
          <button class="primary-button" id="new-recipe" type="button">New Recipe</button>
        </div>
      </header>

      <main class="workspace-page">
        <div class="menu-shell">
          <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="workspace-menu">Menu</button>
          <nav id="workspace-menu" class="tabs" aria-label="Workspace sections">
            <a class="tab-button" href="index.html">Recipe</a>
            <a class="tab-button is-active" href="admin.html">Admin</a>
            <a class="tab-button" href="batch.html">Batch Log</a>
            <a class="tab-button" href="lots.html">Flour Lots</a>
            <a class="tab-button" href="orders.html">Orders</a>
            <a class="tab-button" href="label.html">Product Label</a>
            <a class="tab-button" href="importer.html">Importer</a>
            <a class="tab-button" href="rules.html">Rules Snapshot</a>
          </nav>
        </div>

        <section class="content-card">
          <div class="section-title">
            <div>
              <h2>Saved recipes</h2>
              <p class="hint">Manage your recipe library, import and export backups, and open a recipe in the editor.</p>
            </div>
          </div>

          <div class="sidebar-header">
            <h3>Recipes</h3>
            <span id="admin-recipe-count" class="count-pill">0</span>
          </div>
          <div id="admin-recipe-list" class="recipe-list"></div>

          <div class="sidebar-footer">
            <p id="save-status">Saved locally in this browser.</p>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="app.js"></script>
    <script src="menu.js"></script>
  </body>
</html>
